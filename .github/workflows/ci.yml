# Server CI, run on demand (Actions tab > CI > Run workflow, or
# `gh workflow run CI --ref <branch>`). On demand by the user's choice
# (2026-10-23): the repo is private, so every run spends free Actions minutes.
#
# Blocking: the test suite and cargo-deny (RustSec advisories, banned crates,
# crate sources). Report-only for now: rustfmt and clippy, because the code is
# not yet rustfmt-clean and clippy still warns; they become blocking after the
# one-time reformat that follows the tick.rs split (housekeeping audit, Phase 2
# and 3).
name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (Linux, the R720's OS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The toolchain pinned in rust-toolchain.toml, stated here as well so a
      # bump of one without the other is visible in review.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt (report only)
        continue-on-error: true
        run: cargo fmt --check

      - name: clippy (report only)
        continue-on-error: true
        run: cargo clippy --all-targets

      # The default members only: the gdext-net crate builds against Godot
      # and is built by hand on the dev box.
      - name: tests
        run: cargo test

  deny:
    name: cargo-deny (advisories, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
