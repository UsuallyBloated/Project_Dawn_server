[package]
name = "projectdawn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# The crate ships extra ops bins (admin_report, grant_gm) alongside the server,
# so `cargo run -p projectdawn-server` needs to know which is the default.
default-run = "projectdawn-server"

[features]
# The `cargo fuzz` entry points (world/fuzzing.rs), for the fuzz/ crate only.
fuzzing = ["dep:arbitrary", "protocol/arbitrary"]

[dependencies]
protocol = { workspace = true }
shared   = { workspace = true }

tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

renet         = { workspace = true }
renet_netcode = { workspace = true }
arbitrary = { workspace = true, optional = true }

sqlx = { workspace = true }

argon2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

toml = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# The handler soak test (world/fuzzing.rs) builds random client messages.
protocol = { workspace = true, features = ["arbitrary"] }
arbitrary = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
renet         = { workspace = true }
renet_netcode = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tempfile = "3.13.0"
proptest = { workspace = true }

[lints]
workspace = true
