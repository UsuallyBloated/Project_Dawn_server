# Active skills, the server's copy (client-authority audit item 6, 2026-10-19).
#
# Mirror of Project_Dawn/data/skill_definitions.gd's `ALL` array, every entry,
# with the fields the server reads: the cooldown, the stamina cost, the damage
# multiplier (0 = a SELF skill with no swing), the classes, and the effect.
# `desc` is the client's own. Kept in step by hand and checked by
# Project_Dawn/tools/check_active_skill_lockstep.gd, which exits 1 on any
# difference, either side.
#
# Effects the server models: STUN (the target cannot move, swing or cast for
# stun_duration; damage does not end it), EVADE_BOOST (every melee swing at
# the user is deflected for effect_duration), ABSORB_SHIELD (a pool of
# absorb_amount, used up by damage), STEALTH (idle mobs do not notice the
# user for stealth_duration; the first swing, skill or hostile cast ends it),
# FEIGN_DEATH (an 80% chance every mob drops the user), WARDER_FURY (the hit,
# then the user's pet is sent at the target), TRUESIGHT (the hit never misses).
#
# The four alignment variants carry a class no character has on the server
# (Paladin_Fallen, Shadow Knight_Redeemed): the class gate refuses them until
# alignment is server-side. Listed so the lockstep check stays clean.

