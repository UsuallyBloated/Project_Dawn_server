# Track 6 sub-task 2 — server-authoritative weapon stats.
#
# Mirrors the per-item .tres resources at
# `Project_Dawn/data/loot/items/*.tres`. Only weapons that need
# server-side damage_min/max are included; ammo, armor, consumables
# stay client-side until inventory becomes server-authoritative.
#
# `path` is the Godot resource path the client sends in
# `ClientWorldMsg::Attack.weapon_path`. Keep these 1:1 with the .tres
# locations so the lookup is a single HashMap hit.
#
# `skill` mirrors `ItemData.weapon_skill` — used by the damage formula
# port for skill-multiplier lookup once `WeaponSkillDefinitions` lands.

[[weapon]]
path = "res://data/loot/items/iron_short_sword.tres"
name = "Iron Short Sword"
damage_min = 7
damage_max = 15
weapon_delay = 2.5
skill = "1h_slashing"
is_ranged = false

