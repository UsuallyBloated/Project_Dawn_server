# Server-side quest table — the authoritative source for quest XP rewards AND
# (since PD_W0024) quest objectives. Mirror of the client's
# `data/quest_definitions.gd` (id / level_req / reward_tier / kill objectives);
# when a quest is added or edited there, mirror it here in the same commit (the
# same lockstep discipline as spells.toml). The server computes the actual XP
# itself (tier% x the cubic band at level_req) and counts objective kills
# itself, so a client can never name its own reward or skip the gameplay.
#
# reward_tier must be one of: trivial / standard / hard / named (fractions are
# in world/quests.rs fn tier_fraction, mirroring the GDScript
# QuestDefinitions.REWARD_TIERS).
#
# objectives: only kind = "kill" is counted server-side. target matches mob
# names by the same bidirectional lowercased substring rule as the client's
# QuestManager.notify_kill ("Wolf" ticks for "Grey Wolf" and vice versa).
# Flavor objectives like test_q1's "report back" line are client display text
# only — the turn-in itself is that step. Every quest MUST list at least one
# objective (an objective-free quest would be a free turn-in; the parser
# rejects it).
#
# item_rewards (PD_W0024 slice B): optional list of item `.tres` paths granted
# server-side on turn-in (one each). Each path MUST exist in items.toml or the
# parser rejects it (regenerate items.toml after adding the .tres). Kept in
# lockstep with the client's QuestDefinitions.item_rewards.

[[quest]]
id = "wolf_threat"
level_req = 1
reward_tier = "standard"
objectives = [ { kind = "kill", target = "Wolf", count = 5 } ]
item_rewards = [ "res://data/loot/items/tarnished_silver_ring.tres" ]
turn_in_npc = "aldric"
[[quest]]
id = "rat_infestation"
