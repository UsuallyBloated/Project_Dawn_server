# Safe areas (spell batch step 2, 2026-10-08). Where a caster may bind a GROUP
# MEMBER (a self-bind works anywhere, as in EQ), and where Succor and Evacuate
# arrive. Circles in world space (y is up); `arrival` is where a port lands.
#
# The unit test in world/safe_areas.rs refuses any circle that a camp spawn's
# aggro radius (plus the 3 m spawn jitter) can reach into, so nobody is ever
# bound or evacuated into a mob's reach. On the 4 km plate (2026-11-13) the
# nearest camp is 180 m from the origin and the town's walls stand 90 m out,
# so the circle covers the square, the NPC row and the streets round them;
# `world/terrain_content.rs` holds every point of it to flat ground.

[[area]]
name = "Town square"
center = [0.0, 0.0, 0.0]
radius = 60.0
arrival = [0.0, 0.0, 0.0]
