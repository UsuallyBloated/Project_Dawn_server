# Track 6 sub-task 3b — server-relevant spell data.
#
# Mirror of Project_Dawn/data/spell_definitions.gd's `ALL` array,
# filtered to server-processable target_types (ENEMY / SELF / AOE /
# NONE) and the subset of fields the damage / heal pipeline reads.
#
# This file should be regenerated when spell tuning changes — see
# Project_Dawn/tools/export_spells.gd (run via Godot editor:
# File → Run on that script). The tool writes to this exact path.
#
# Sub-task 3b initial commit covers ~30 representative spells (heals
# + damage across every caster class) so the heal regression closes
# for the most-cast spells. Re-running the tool will land the
# remaining ~50 (more damage variants, rank II/III spells).
#
# Buffs / HoT / DoT / CC / port / song fields are intentionally
# absent — those stay client-side until sub-task 4 lifts buff state
# server-side. The server's CastSpell handler applies base_damage
# (to ENEMY target) or heal_amount (to SELF) and ignores side
# effects.

