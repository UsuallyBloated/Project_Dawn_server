# ══ Summon Food and Drink ═════════════════════════════════════════════
# Food slice 2 (user call 2026-10-15, Monsters and Memories' shape): a
# SUMMON_ITEM spell conjures `summon_item` into the caster's bags, one at
# the level the class gets the spell and one more per level after (user,
# 2026-10-19; it was one per ten levels to four), capped at `summon_max`. `class_min_levels` carries the per-class levels (EQ's,
# via the P99 wiki and Al'Kabor: Summon Food CLR 9 / DRU 14 / SHM 9 /
# MAG 1, Summon Drink CLR 3 / DRU 10 / SHM 2 / MAG 1); `min_level` is the
# lowest of them. The conjured items have no vendor value, so a merchant
# will not buy them.
[[spell]]
name = "Summon Food"
target_type = "SUMMON_ITEM"
damage_type = "NONE"
base_damage = 0.0
heal_amount = 0.0
mana_cost = 10.0
cast_time = 4.0
cooldown = 0.0
min_level = 1
classes = ["Magician", "Cleric", "Shaman", "Druid"]
class_min_levels = { Magician = 1, Cleric = 9, Shaman = 9, Druid = 14 }
summon_item = "res://data/loot/items/conjured_bread.tres"
summon_max = 10

[[spell]]
name = "Summon Drink"
