# Twist songs (the Bard song rework, 2026-10-20; user decisions, classic
# EQ's rules as Project 1999 keeps them): a song takes 3 s to sing, costs no
# mana, and the SERVER pulses it every SONG_PULSE_SECS (6 s), each effect
# lingering SONG_LINGER_SECS (12 s) after the last pulse; one song at a time,
# a new song replacing the current one while the old one's effect lingers
# (twisting). Every effect below is the LEVEL-50 value: a song runs at
# SONG_SCALE_AT_LEARN (0.4) of it when first learned and climbs to the full
# value at SONG_FULL_AT_LEVEL (world/songs.rs), so a level 1 bard is not a
# level 50 one. Mana Weave is P99's mana song: 6 mana per 6 s tick
# (mp_regen_hps 1.0; EQ gave it to the group and not the bard, so when group
# songs come, follow that). Durations are the linger constant, not fields.
[[spell]]
name = "Selos' Melody"
is_song = true
target_type = "SELF"
damage_type = "ARCANE"
base_damage = 0.0
heal_amount = 0.0
mana_cost = 0.0
cast_time = 3.0
cooldown = 0.5
min_level = 1
move_speed_mult = 1.35
classes = ["Bard"]

