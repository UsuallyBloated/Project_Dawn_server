# Starter-zone spawn camps — server-authoritative source of truth.
#
# Ported from `Project_Dawn/data/zone_data.gd` (`STARTER_ZONE_CAMPS`). The
# game client used to instantiate `EnemySpawner` nodes from that array at
# scene-ready; that path is now obsolete in launcher mode. The server reads
# this file at startup, populates `SpawnPoint`s, and is solely responsible
# for spawning + ticking the mobs.
#
# Required mob keys:  name, level, hp, dmg, xp, speed, aggro
# Optional camp keys: radius (default 3.0), respawn (default 35.0)
# Optional mob keys:  leash (default = aggro * 2), melee_range (default 1.8),
#                     attack_interval (default 2.5)
#
# Coordinates are world-space (Vector3 in Godot — y is up). Spawn-point
# offsets at runtime apply a random XZ jitter within `radius`.

default_radius = 3.0
default_respawn = 35.0

