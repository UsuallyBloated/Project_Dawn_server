# Starter-zone spawn camps — server-authoritative source of truth.
#
# REPLACED 2026-09-10 (phase 4 content pass, docs/design/phase4_content_plan.md
# in the client repo). The original 9-camp table was ported from the client's
# old `zone_data.gd` and predated the quests; this layout is designed around
# them instead: every quest target spawns where its giver's dialogue says, the
# even-con ladder is continuous through level 7 (the old table jumped 6 to 9),
# and every mob below the two far camps matches a `loot.rs` table by name.
# The five authored named mobs each get a single-spawn den with a long respawn.
#
# The server reads this file at startup, populates `SpawnPoint`s, and is solely
# responsible for spawning + ticking the mobs. The client renders any mob name
# through the shared remote_enemy scene, so this file needs no client mirror.
#
# Required mob keys:  name, level, hp, dmg, xp, speed, aggro
#   (`xp` is legacy: per-kill XP derives from `level` in progression::kill_xp;
#   the parser still requires the key, so values here follow the old curve.)
# Optional camp keys: radius (default 3.0), respawn (default 35.0)
# Optional mob keys:  leash (default = aggro * 2), melee_range (default 1.8),
#                     attack_interval (default 2.5), named_id (named_mobs.toml)
#
# MOVED 2026-11-13 to the 4 km plate (the client's
# docs/design/starting_area_comp_sketches.html): every camp keeps its mobs and
# its pattern of spawns, spread three times wider, and stands about ten times
# further from the town, so the first camps are a minute's run from the gate
# and the Wraith Gate about six. No spawn was added: 54, as before.
#
# Coordinates are world-space (Vector3 in Godot: y is up, and the y written
# here is a placeholder the ground overrides). Spawn-point offsets at runtime
# apply a random XZ jitter within `radius`. The town is the 150 m of flat
# ground round the origin; the nearest spawn is 180 m from it.

default_radius = 3.0
default_respawn = 35.0

