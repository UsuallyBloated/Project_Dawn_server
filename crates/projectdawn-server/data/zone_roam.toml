# ── Night only · 21:00 to 05:00 game time (400 real seconds) ──────────
# Short respawns, since a night is short. Shades are undead: they belong to
# the restless dead, carry coin and no animal's loot, and stay in the outer
# bands, so the standing and alignment an undead kill pays is not farmed at
# the town's door.
[[roam]]
desc = "Bats over the near basin after dark"
mob = { name = "Bat", level = 4, hp = 44.0, dmg = 8, speed = 4.5, aggro = 10.0, faction = "wildlife", alignment = "neutral" }
