# Wandering wildlife: the animals that live in a region instead of at a spawn
# point (design: docs/design/wandering_wildlife.md in the client repo; code:
# src/world/roam.rs, spawn_points.rs, Entity::tick_roam).
#
# A file of its own, NOT appended to zone_camps.toml: the client tools' camp
# parser splits that file on `[[camp]]` and would read anything after the last
# camp as part of it. Server only; the client needs no mirror.
#
# Each [[roam]] entry is `count` slots. A slot is one animal, or with
# `pack = n` a pack of n that follows a leader and joins its fights. A slot
# refills `respawn` seconds (rolled 25% either way) after a death, at a fresh
# spot in its region: on the roam map (floors reachable from the town without
# crossing a face), at least 150 m from the town's middle and 60 m from every
# player. `time = "night"` slots are alive only from 21:00 to 05:00 game time.
#
# region = { center = [x, z], radius, min_from_town, z_min, z_max }
#   WORLD coordinates: x east, z SOUTH (north is -z). The circle about
#   `center`, less anything nearer the town's middle (the origin) than
#   `min_from_town`, less anything outside the z band. The ridge runs from
#   z = -1010 (its north foot) to z = -790 (its south foot), so `z_min = -760`
#   keeps a region in the town's basin and `z_max = -1030` in the Greywood.
#   To see the ground: `cargo test -p projectdawn-server --lib
#   print_the_roam_map -- --ignored --nocapture`.
#
# mob: the camp table's keys (name, level, hp, dmg, speed, aggro; optional
#   leash, melee_range, attack_interval, faction, alignment). `aggro = 0` is a
#   passive animal: it never starts a fight and fights back when hit; it MUST
#   carry `leash` of at least 35 (the loader refuses it otherwise). `xp` is
#   not needed: a kill pays by level.
#
# Names matter (the unit tests in roam.rs hold all of this): an animal's name
# must contain a word loot.rs knows (wolf, rat, snake, adder, viper, bear,
# bat), or it rolls no items and drops coin like a humanoid. Wolves count for
# the wolf quests ("Wolf" is a substring); nothing else here may match a quest
# target, which is why the rats are not "Plague" rats and no snake is a
# "Rattlesnake" ("rat").
#
# Hit points and damage follow the camp ladder at the same level; bears carry
# a quarter more hit points and swing slower (2.8 s), snakes a quarter fewer
# hit points and a short 6 m aggro (an ambush you can outrun at 2.4 m/s).
# The bands follow the camp rings: 70 animals by day, 14 more at night.

# ── Town meadows · 150-420 m · lvl 1-2 ────────────────────────────────
[[roam]]
desc = "Field rats in the meadows round the town; short-sighted, so they add to a fight only when it drifts onto them"
mob = { name = "Field Rat", level = 1, hp = 16.0, dmg = 3, speed = 4.0, aggro = 6.0, faction = "wildlife", alignment = "neutral" }
region = { center = [0.0, 0.0], radius = 420.0 }
count = 6
respawn = 180.0

[[roam]]
desc = "Grass snakes in the meadows; harmless unless trodden on"
mob = { name = "Grass Snake", level = 2, hp = 20.0, dmg = 5, speed = 2.4, aggro = 0.0, leash = 35.0, faction = "wildlife", alignment = "neutral" }
region = { center = [0.0, 0.0], radius = 420.0 }
count = 6
respawn = 180.0

