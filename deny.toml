# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run by the
# on-demand CI workflow (.github/workflows/ci.yml) as
# `cargo deny check advisories bans sources`; locally the same with cargo-deny
# installed. Licenses are not checked yet: the project is proprietary and which
# licenses it accepts is the owner's call.

[graph]
all-features = false

[advisories]
version = 2
# A crate with a RustSec advisory fails the check. To accept one knowingly,
# list its id here with a comment saying why and until when.
ignore = []
yanked = "warn"

[bans]
# Several versions of one crate is common in a tree this size; report it, do
# not fail on it.
multiple-versions = "warn"
# The workspace's own crates depend on each other by path.
wildcards = "allow"

[sources]
# Every crate comes from crates.io: anything from another registry or a git
# repository fails the check, so a new one is a deliberate decision.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
